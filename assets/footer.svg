<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812" />
      <stop offset="50%" stop-color="#091425" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
    <radialGradient id="footerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
    .footer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 32px; fill: #ffffff; }
    .footer-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; fill: #94a3b8; }
    .footer-mono { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #64748b; letter-spacing: 1.5; }
    .footer-star { transform-origin: center; animation: pulse 3s ease-in-out infinite; }
  </style>
  <rect width="1200" height="230" rx="18" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1.4" />
  <rect width="1200" height="230" rx="18" fill="url(#footerGlow)" />

  <!-- Animated Center Star -->
  <g transform="translate(600, 48)">
    <path d="M 0 -14 Q 0 -2 12 -2 Q 0 -2 0 10 Q 0 -2 -12 -2 Q 0 -2 0 -14 Z" fill="#00f5a0" class="footer-star" />
  </g>

  <text x="600" y="105" text-anchor="middle" class="footer-title" letter-spacing="-0.5">Let's build something together.</text>
  <text x="600" y="142" text-anchor="middle" class="footer-sub">Open to freelance projects, collaboration, and engineering contracts.</text>
  <text x="600" y="190" text-anchor="middle" class="footer-mono">JOMBANG, INDONESIA &nbsp;·&nbsp; UTC+7</text>
</svg>