<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Rizky Ramdani Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#091322" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <radialGradient id="mintGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cyanMintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="amberMintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes runLine {
      from { stroke-dashoffset: 120; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes runLineRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 120; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
    @keyframes floatBox {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatBox2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseRadar {
      0% { r: 6; opacity: 0.8; stroke-width: 1.5; }
      100% { r: 38; opacity: 0; stroke-width: 0.5; }
    }

    .line-flow {
      stroke-dasharray: 6 6;
      animation: runLine 3s linear infinite;
    }
    .line-flow-fast {
      stroke-dasharray: 8 6;
      animation: runLineRev 2.2s linear infinite;
    }
    .pulse-dot {
      transform-origin: center;
      animation: pulseGlow 2.4s ease-in-out infinite;
    }
    .twinkle-star {
      transform-origin: center;
      animation: twinkle 3s ease-in-out infinite;
    }
    .float-web {
      animation: floatBox 5s ease-in-out infinite;
    }
    .float-mob {
      animation: floatBox2 6s ease-in-out infinite;
    }
    .radar-wave {
      animation: pulseRadar 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .text-mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="490" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1200" height="490" rx="20" fill="url(#mintGlow)" />
  <rect width="1200" height="490" rx="20" fill="url(#cyanGlow)" />
  <rect width="1200" height="490" rx="20" fill="url(#dotGrid)" />

  <!-- Animated Constellation Background Stars -->
  <g opacity="0.7">
    <circle cx="150" cy="80" r="1.5" fill="#00f5a0" class="twinkle-star" style="animation-delay: 0.2s;" />
    <circle cx="380" cy="60" r="1" fill="#00d2ff" class="twinkle-star" style="animation-delay: 1.1s;" />
    <circle cx="580" cy="120" r="2" fill="#ffffff" class="twinkle-star" style="animation-delay: 0.5s;" />
    <circle cx="90" cy="380" r="1.5" fill="#00f5a0" class="twinkle-star" style="animation-delay: 1.8s;" />
    <circle cx="420" cy="440" r="2" fill="#00d2ff" class="twinkle-star" style="animation-delay: 0.9s;" />
    <circle cx="1120" cy="80" r="1.5" fill="#f59e0b" class="twinkle-star" style="animation-delay: 2.1s;" />
    <circle cx="680" cy="420" r="1.5" fill="#00f5a0" class="twinkle-star" style="animation-delay: 1.3s;" />
  </g>

  <!-- ANIMATED RUNNING CONSTELLATION LINES (Garis Hidup Berjalan) -->
  <g>
    <!-- Line 1: From left text to Web Window -->
    <path d="M 520 180 Q 640 140 730 160" fill="none" stroke="#00f5a0" stroke-width="2" opacity="0.8" class="line-flow" />
    <!-- Line 2: From Web Window to Mobile Phone -->
    <path d="M 920 160 Q 980 200 1020 230" fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.85" class="line-flow-fast" />
    <!-- Line 3: From Web Window down to Chip/Backend -->
    <path d="M 830 240 Q 820 320 830 360" fill="none" stroke="#00f5a0" stroke-width="1.8" opacity="0.75" class="line-flow" />
    <!-- Line 4: From Backend to Mobile Phone -->
    <path d="M 890 380 Q 980 390 1030 350" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8" class="line-flow-fast" />

    <!-- Animated Data Pulses along lines -->
    <circle cx="630" cy="150" r="3.5" fill="#00f5a0" class="pulse-dot" />
    <circle cx="970" cy="190" r="4" fill="#00d2ff" class="pulse-dot" style="animation-delay: 0.7s;" />
    <circle cx="825" cy="300" r="3.5" fill="#00f5a0" class="pulse-dot" style="animation-delay: 1.2s;" />
    <circle cx="960" cy="385" r="4" fill="#f59e0b" class="pulse-dot" style="animation-delay: 0.4s;" />
  </g>

  <!-- LEFT COLUMN: Profile Info & Value Proposition -->
  <g transform="translate(64, 55)">
    <!-- Pill Badge: OPEN TO COLLABORATION -->
    <g transform="translate(0, 0)">
      <rect width="215" height="32" rx="16" fill="#0b1728" stroke="#10b981" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#00f5a0" />
      <circle cx="16" cy="16" r="4.5" fill="none" stroke="#00f5a0" class="radar-wave" />
      <text x="32" y="20.5" fill="#00f5a0" class="text-mono" font-size="11" font-weight="700" letter-spacing="1">OPEN TO COLLABORATION</text>
    </g>

    <!-- Main Title: Rizky Ramdani -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" fill="#ffffff" class="text-title" font-size="44" letter-spacing="-0.5">Rizky Ramdani</text>
      <!-- Sparkle Icon -->
      <path d="M 330 -18 Q 330 -2 344 -2 Q 330 -2 330 14 Q 330 -2 316 -2 Q 330 -2 330 -18 Z" fill="#00f5a0" class="twinkle-star" />
    </g>

    <!-- Subtitle: Full-Stack Web & Mobile Developer -->
    <text x="0" y="115" fill="#00d2ff" class="text-title" font-size="20" font-weight="600">
      Full-Stack Web &amp; Mobile Developer · Freelance Specialist
    </text>

    <!-- Tagline -->
    <text x="0" y="152" fill="#cbd5e1" class="text-title" font-size="14" font-weight="400">
      Building reliable, production-ready digital products for businesses
    </text>
    <text x="0" y="174" fill="#00f5a0" class="text-title" font-size="14" font-weight="700">
      since 2021.
    </text>

    <!-- 3 Capsule Tags -->
    <g transform="translate(0, 210)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#0d182b" stroke="#1e2d4a" stroke-width="1" />
      <circle cx="15" cy="15" r="3.5" fill="#00f5a0" />
      <text x="28" y="19" fill="#e2e8f0" class="text-title" font-size="12" font-weight="600">Mobile Apps</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="168" height="30" rx="15" fill="#0d182b" stroke="#1e2d4a" stroke-width="1" />
      <circle cx="157" cy="15" r="3.5" fill="#00d2ff" />
      <text x="170" y="19" fill="#e2e8f0" class="text-title" font-size="12" font-weight="600">Web &amp; Dashboards</text>

      <!-- Tag 3 -->
      <rect x="322" y="0" width="160" height="30" rx="15" fill="#0d182b" stroke="#1e2d4a" stroke-width="1" />
      <circle cx="337" cy="15" r="3.5" fill="#f59e0b" />
      <text x="350" y="19" fill="#e2e8f0" class="text-title" font-size="12" font-weight="600">APIs &amp; POS Systems</text>
    </g>

    <!-- Location & Metadata -->
    <g transform="translate(0, 275)" opacity="0.85">
      <text x="0" y="0" fill="#64748b" class="text-mono" font-size="12">
        📍 Jombang, Indonesia &nbsp;·&nbsp; UTC+7 &nbsp;·&nbsp; Remote: Worldwide
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: FLOATING WIREFRAME ILLUSTRATIONS (Web, Mobile, Chip) -->
  <!-- 1. Web Window Card (Floating) -->
  <g class="float-web" transform="translate(730, 80)">
    <!-- Window Body -->
    <rect width="210" height="150" rx="14" fill="#0d172a" stroke="#00f5a0" stroke-width="1.8" opacity="0.95" />
    <path d="M 0 32 L 210 32" stroke="#1e2d4a" stroke-width="1.2" />
    <!-- Window Controls -->
    <circle cx="16" cy="16" r="4" fill="#ef4444" />
    <circle cx="28" cy="16" r="4" fill="#f59e0b" />
    <circle cx="40" cy="16" r="4" fill="#10b981" />
    <!-- Category Label -->
    <text x="160" y="20" fill="#00f5a0" class="text-mono" font-size="9" font-weight="700">WEB</text>
    <!-- Code / Wireframe Bars -->
    <rect x="18" y="48" width="90" height="10" rx="5" fill="#00f5a0" opacity="0.8" />
    <rect x="18" y="66" width="160" height="8" rx="4" fill="#00d2ff" opacity="0.6" />
    <rect x="18" y="82" width="130" height="8" rx="4" fill="#1e293b" />
    <rect x="18" y="98" width="150" height="8" rx="4" fill="#1e293b" />
    <!-- Dynamic Bar Chart inside Web -->
    <rect x="18" y="122" width="22" height="16" rx="3" fill="#00f5a0" opacity="0.7" />
    <rect x="46" y="114" width="22" height="24" rx="3" fill="#00d2ff" opacity="0.8" />
    <rect x="74" y="118" width="22" height="20" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="102" y="110" width="22" height="28" rx="3" fill="#00f5a0" />
  </g>

  <!-- 2. Mobile Phone Card (Floating) -->
  <g class="float-mob" transform="translate(1000, 160)">
    <!-- Phone Body -->
    <rect width="135" height="230" rx="22" fill="#0b1322" stroke="#00d2ff" stroke-width="2" opacity="0.95" />
    <!-- Notch / Speaker -->
    <rect x="45" y="10" width="45" height="4" rx="2" fill="#1e293b" />
    <!-- Category Label -->
    <text x="75" y="32" fill="#00d2ff" class="text-mono" font-size="9" font-weight="700">MOBILE</text>
    <!-- App Header & Card -->
    <rect x="14" y="44" width="107" height="36" rx="8" fill="#111c33" stroke="#1e2d4a" stroke-width="1" />
    <circle cx="28" cy="62" r="7" fill="#00f5a0" />
    <rect x="42" y="56" width="55" height="6" rx="3" fill="#ffffff" opacity="0.8" />
    <rect x="42" y="66" width="40" height="4" rx="2" fill="#64748b" />
    <!-- Animated Chart Line -->
    <path d="M 20 120 Q 40 100 65 115 T 115 95" fill="none" stroke="#00f5a0" stroke-width="2.5" class="line-flow" />
    <!-- Activity Bar Cards -->
    <rect x="14" y="140" width="107" height="18" rx="5" fill="#111c33" />
    <rect x="14" y="164" width="107" height="18" rx="5" fill="#111c33" />
    <rect x="14" y="188" width="107" height="18" rx="5" fill="#111c33" />
    <!-- Home Bar -->
    <rect x="48" y="218" width="40" height="3" rx="1.5" fill="#475569" />
  </g>

  <!-- 3. Microchip / Backend Node (Bottom Center) -->
  <g transform="translate(770, 310)">
    <!-- Chip Outline -->
    <rect width="120" height="120" rx="16" fill="#0a1220" stroke="#f59e0b" stroke-width="1.8" />
    <text x="46" y="25" fill="#f59e0b" class="text-mono" font-size="9" font-weight="700">API/POS</text>
    <!-- Inner Core with Radar Wave -->
    <circle cx="60" cy="65" r="18" fill="#111f38" stroke="#00f5a0" stroke-width="1.5" />
    <circle cx="60" cy="65" r="7" fill="#f59e0b" />
    <circle cx="60" cy="65" r="7" fill="none" stroke="#f59e0b" class="radar-wave" />
    <!-- Chip Pins -->
    <line x1="25" y1="0" x2="25" y2="-8" stroke="#f59e0b" stroke-width="2" />
    <line x1="60" y1="0" x2="60" y2="-8" stroke="#f59e0b" stroke-width="2" />
    <line x1="95" y1="0" x2="95" y2="-8" stroke="#f59e0b" stroke-width="2" />
    <line x1="0" y1="40" x2="-8" y2="40" stroke="#f59e0b" stroke-width="2" />
    <line x1="0" y1="80" x2="-8" y2="80" stroke="#f59e0b" stroke-width="2" />
    <line x1="120" y1="40" x2="128" y2="40" stroke="#f59e0b" stroke-width="2" />
    <line x1="120" y1="80" x2="128" y2="80" stroke="#f59e0b" stroke-width="2" />
  </g>
</svg>