<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="whyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <style>
    .why-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #ffffff; }
    .why-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.4; }
  </style>

  <!-- Card 1 -->
  <g transform="translate(0, 0)">
    <rect width="285" height="150" rx="14" fill="#0b1322" stroke="url(#whyBorder)" stroke-width="1.2" />
    <g transform="translate(20, 22)">
      <circle cx="16" cy="16" r="14" fill="#00f5a0" fill-opacity="0.12" stroke="#00f5a0" stroke-width="1" />
      <path d="M 17 9 L 12 17 L 16 17 L 14 23 L 20 15 L 16 15 Z" stroke="#00f5a0" stroke-width="1.5" fill="none" />
      <text x="38" y="21" class="why-title">Fast Delivery</text>
      <text x="0" y="58" class="why-desc" font-weight="600" fill="#e2e8f0">On-time milestones</text>
      <text x="0" y="78" class="why-desc">Structured sprint planning and</text>
      <text x="0" y="96" class="why-desc">predictable feature release.</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(305, 0)">
    <rect width="285" height="150" rx="14" fill="#0b1322" stroke="url(#whyBorder)" stroke-width="1.2" />
    <g transform="translate(20, 22)">
      <circle cx="16" cy="16" r="14" fill="#00d2ff" fill-opacity="0.12" stroke="#00d2ff" stroke-width="1" />
      <path d="M 10 11 H 22 A 2 2 0 0 1 24 13 V 19 A 2 2 0 0 1 22 21 H 13 L 9 24 V 13 A 2 2 0 0 1 11 11 Z" stroke="#00d2ff" stroke-width="1.5" fill="none" />
      <text x="38" y="21" class="why-title">Clear Updates</text>
      <text x="0" y="58" class="why-desc" font-weight="600" fill="#e2e8f0">Transparent progress</text>
      <text x="0" y="78" class="why-desc">Regular async updates, live</text>
      <text x="0" y="96" class="why-desc">staging demos, &amp; quick replies.</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(610, 0)">
    <rect width="285" height="150" rx="14" fill="#0b1322" stroke="url(#whyBorder)" stroke-width="1.2" />
    <g transform="translate(20, 22)">
      <circle cx="16" cy="16" r="14" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1" />
      <path d="M 12 18 L 10 16 A 4 4 0 0 1 15 10 L 17 12 M 20 14 L 22 16 A 4 4 0 0 1 17 22 L 15 20" stroke="#f59e0b" stroke-width="1.5" fill="none" />
      <text x="38" y="21" class="why-title">Clean Code</text>
      <text x="0" y="58" class="why-desc" font-weight="600" fill="#e2e8f0">Scalable &amp; maintainable</text>
      <text x="0" y="78" class="why-desc">Fully-typed, modular, robust</text>
      <text x="0" y="96" class="why-desc">architecture built to last.</text>
    </g>
  </g>

  <!-- Card 4 -->
  <g transform="translate(915, 0)">
    <rect width="285" height="150" rx="14" fill="#0b1322" stroke="url(#whyBorder)" stroke-width="1.2" />
    <g transform="translate(20, 22)">
      <circle cx="16" cy="16" r="14" fill="#00f5a0" fill-opacity="0.12" stroke="#00f5a0" stroke-width="1" />
      <path d="M 10 10 L 22 22 M 16 10 L 22 10 L 22 16" stroke="#00f5a0" stroke-width="1.5" fill="none" />
      <text x="38" y="21" class="why-title">After-Launch</text>
      <text x="0" y="58" class="why-desc" font-weight="600" fill="#e2e8f0">Ongoing support</text>
      <text x="0" y="78" class="why-desc">Deployment warranty, bug</text>
      <text x="0" y="96" class="why-desc">fixes, and server maintenance.</text>
    </g>
  </g>
</svg>